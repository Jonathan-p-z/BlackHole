[package]
name = "blackhole-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
blackhole-core = { version = "0.1.0", path = "../blackhole-core" }
blackhole-dns = { version = "0.1.0", path = "../blackhole-dns" }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
rand = "0.10.2"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
