[package]
name = "blackhole-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arti-client = { version = "0.45.0", features = ["tokio", "rustls", "static-sqlite"] }
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "net", "fs", "io-util"] }
toml = "1"
tor-rtcompat = { version = "0.45.0", features = ["tokio", "rustls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_System_Rpc", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
